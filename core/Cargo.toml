[package]
name = "warpinator-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
mdns-sd = "0.18.2"
prost = "0.14.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.5", features = ["tls-ring"] }
hostname = "0.4.2"
tonic-prost = "0.14.5"
tracing = "0.1.44"
http = "1.4.0"
x509-cert = { version = "0.2.5", features = ["builder"] }
rsa = { version = "0.9.10", features = ["sha2"] }
crypto_secretbox = { version = "0.1.1", features = ["salsa20"] }
sha2 = "0.10.9"
rand = "0.10.0"
thiserror = "2.0.18"
base64 = "0.22.1"
tokio-util = "0.7.19"
local-ip-address = "0.6.10"
uuid = { version = "1.22.0", features = ["v4"] }
chrono = "0.4.44"
bitflags = "2.11.0"
async-walkdir = { version = "2.1.0", optional = true}
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"], optional = true }
async-trait = { version = "0.1.89", optional = true }

[build-dependencies]
tonic-prost-build = "0.14.5"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
ratatui = "0.30.0"
anyhow = "1.0.102"
bytesize = "2.3.1"

[features]
default = ["messaging", "real_filesystem"]
messaging = []
power_manager = []
serde = ["dep:serde", "bitflags/serde"]
real_filesystem = ["dep:async-walkdir"]
virtual_filesystem = ["dep:async-trait"]
